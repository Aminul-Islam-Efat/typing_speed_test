<style>
/* ================= RESET & VARIABLES ================= */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117; --panel:rgba(17,23,33,0.72); --stroke:rgba(34,224,255,0.14);
  --cyan:#22e0ff; --magenta:#ff2e88; --green:#3dffa0; --red:#ff4060;
  --text:#c9d1d9; --dim:#4c5866; --line-h:2.85rem; --fs:1.55rem;
}
html{font-size:16px}
body{
  min-height:100vh;
  font-family:'JetBrains Mono',ui-monospace,'Fira Code','Roboto Mono',monospace;
  color:var(--text);
  background:
    radial-gradient(1100px 620px at 12% -12%,rgba(34,224,255,.11),transparent 62%),
    radial-gradient(900px 520px at 96% -6%,rgba(255,46,136,.10),transparent 60%),
    radial-gradient(900px 640px at 50% 122%,rgba(34,224,255,.07),transparent 62%),
    var(--bg);
  display:flex; align-items:center; justify-content:center;
  padding:2rem 1.1rem; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:-50%;
  background-image:
    linear-gradient(rgba(34,224,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,224,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  transform:perspective(600px) rotateX(58deg) translateY(-10%);
  pointer-events:none; z-index:0;
  animation:gridDrift 26s linear infinite; opacity:.55;
}
@keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:0 46px,46px 0}}

/* ================= APP SHELL ================= */
.app{
  position:relative; z-index:2; width:100%; max-width:1020px;
  background:var(--panel); border:1px solid var(--stroke); border-radius:20px;
  padding:1.6rem 1.8rem 1.5rem;
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 30px 90px -30px rgba(0,0,0,.9),0 0 70px -30px rgba(34,224,255,.35);
}

/* ================= TOPBAR ================= */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; flex-wrap:wrap; padding-bottom:1.1rem;
  border-bottom:1px solid rgba(255,255,255,.055);
}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:.16em;font-size:1.02rem;user-select:none}
.brand .glyph{
  display:grid; place-items:center; width:32px; height:32px; border-radius:9px; font-size:.95rem;
  color:#04121a; background:linear-gradient(140deg,var(--cyan),#7af6ff);
  box-shadow:0 0 18px rgba(34,224,255,.55); animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 14px rgba(34,224,255,.45)}50%{box-shadow:0 0 26px rgba(34,224,255,.85)}}
.brand .name{color:#eaf6ff}
.brand .name em{font-style:normal;color:var(--magenta);text-shadow:0 0 14px rgba(255,46,136,.75)}

.controls{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(8,12,18,.65);border:1px solid rgba(255,255,255,.06)}
.seg-btn{
  font-family:inherit;font-size:.74rem;letter-spacing:.05em;
  padding:.42rem .68rem;border:0;border-radius:7px;background:transparent;
  color:var(--dim);cursor:pointer;transition:all .18s ease;white-space:nowrap;
}
.seg-btn:hover{color:#9fb3c8;background:rgba(255,255,255,.04)}
.seg-btn.active{color:#04121a;background:linear-gradient(140deg,var(--cyan),#7af6ff);box-shadow:0 0 16px rgba(34,224,255,.5);font-weight:700}
.icon-btn{
  font-family:inherit;font-size:.95rem;width:38px;height:38px;
  display:grid;place-items:center;border-radius:10px;
  border:1px solid rgba(255,255,255,.08);background:rgba(8,12,18,.65);
  color:var(--dim);cursor:pointer;transition:all .18s ease;
}
.icon-btn:hover{color:var(--cyan);border-color:rgba(34,224,255,.45);box-shadow:0 0 16px rgba(34,224,255,.28)}
.icon-btn.on{color:var(--cyan);border-color:rgba(34,224,255,.5);box-shadow:0 0 16px rgba(34,224,255,.3)}
.strict-btn{
  font-family:inherit;font-size:.68rem;letter-spacing:.15em;font-weight:700;
  padding:.52rem .72rem;border-radius:10px;cursor:pointer;transition:all .18s ease;
  border:1px solid rgba(255,255,255,.08);background:rgba(8,12,18,.65);
  color:var(--dim);white-space:nowrap;
}
.strict-btn:hover{color:#9fb3c8;border-color:rgba(255,255,255,.2)}
.strict-btn.on{color:#04121a;border-color:transparent;background:linear-gradient(140deg,var(--magenta),#ff7ab0);box-shadow:0 0 20px -2px rgba(255,46,136,.75)}

/* ================= AD SLOT ================= */
.ad-slot{
  margin:1rem 0;padding:.4rem;border-radius:12px;
  background:rgba(255,255,255,.015);border:1px dashed rgba(34,224,255,.12);
  text-align:center;min-height:60px;
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;color:#3f4a58;letter-spacing:.1em;overflow:hidden;
  transition:opacity .3s ease;
}
.ad-slot.typing-active{opacity:.15;pointer-events:none}
.ad-slot ins{display:block;width:100%}

/* ================= HUD ================= */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:1.35rem 0 .35rem}
.hud-item{
  display:flex;flex-direction:column;align-items:center;gap:.28rem;
  padding:.6rem .4rem;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.028),transparent);
  border:1px solid rgba(255,255,255,.045);
}
.hud-item .k{font-size:.6rem;letter-spacing:.22em;color:var(--dim);font-weight:600}
.hud-item .v{
  font-size:1.55rem;font-weight:800;color:var(--cyan);
  text-shadow:0 0 18px rgba(34,224,255,.45);line-height:1;
  font-variant-numeric:tabular-nums;transition:color .2s;
}
.hud-item .v.warn{color:var(--magenta);text-shadow:0 0 18px rgba(255,46,136,.6)}

/* ================= TYPING AREA ================= */
.typing-area{position:relative;height:calc(var(--line-h) * 3);overflow:hidden;margin:1.5rem 0 1.1rem;padding:0 .2rem;cursor:text}
.typing-area::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(to bottom,transparent,rgba(13,17,23,.92));
  pointer-events:none;z-index:3;
}
.words{
  position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;
  gap:0 .62ch;font-size:var(--fs);font-weight:400;
  transition:transform .18s cubic-bezier(.25,.8,.35,1);will-change:transform;
}
.word{display:flex;align-items:center;height:var(--line-h);border-bottom:1px solid transparent;transition:border-color .2s ease}
.word.active{border-bottom-color:rgba(34,224,255,.18)}
.char{color:#4a5566;transition:color .07s linear,text-shadow .07s linear;white-space:pre}
.char.correct{color:var(--green);text-shadow:0 0 10px rgba(61,255,160,.4)}
.char.incorrect{color:var(--red);text-shadow:0 0 12px rgba(255,64,96,.65);animation:shakeX .13s linear}
.char.blocked{color:var(--red);text-shadow:0 0 16px rgba(255,64,96,.9);animation:shakeX .16s linear}
@keyframes shakeX{0%{transform:translateX(0)}35%{transform:translateX(-2px)}70%{transform:translateX(2px)}100%{transform:translateX(0)}}
.caret{
  position:absolute;top:0;left:0;width:2.5px;height:1.95rem;border-radius:2px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 24px rgba(34,224,255,.65);
  transform:translate(0,0);transition:transform .085s cubic-bezier(.2,.85,.3,1);
  pointer-events:none;z-index:2;
}
.caret.blink{animation:caretBlink 1.05s steps(1) infinite}
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:.05}}
.caret.error{background:var(--red);box-shadow:0 0 10px var(--red),0 0 26px rgba(255,64,96,.8)}

/* ================= HINT ================= */
.hint{text-align:center;font-size:.7rem;letter-spacing:.09em;color:#3f4a58;user-select:none}
.hint kbd{font-family:inherit;font-size:.65rem;padding:.14rem .4rem;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#7d8b9b}
.hint .on-tag{color:var(--magenta)}

/* ================= FOOTER ================= */
.footer{
  text-align:center;font-size:.65rem;color:#3f4a58;
  margin-top:1.2rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.05);
}
.footer a{color:#7d8b9b;text-decoration:none;margin:0 .4rem;transition:color .18s}
.footer a:hover{color:var(--cyan)}

/* ================= MODAL ================= */
.overlay{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:1.2rem;background:rgba(4,7,11,.82);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
.overlay.show{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:680px;max-height:92vh;overflow-y:auto;
  padding:1.9rem 1.8rem 1.6rem;border-radius:20px;
  background:linear-gradient(170deg,rgba(20,27,38,.97),rgba(11,15,22,.99));
  border:1px solid rgba(34,224,255,.22);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 0 90px -18px rgba(34,224,255,.4),0 40px 90px -30px #000;
  animation:modalIn .3s cubic-bezier(.2,.9,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-title{text-align:center;font-size:.74rem;letter-spacing:.42em;color:var(--dim);font-weight:600;margin-bottom:1rem}
.rank{
  display:block;width:fit-content;margin:0 auto 1.5rem;padding:.5rem 1.5rem;
  font-size:1rem;font-weight:800;letter-spacing:.2em;border-radius:999px;
  color:var(--rank,var(--cyan));border:1px solid currentColor;
  box-shadow:0 0 28px -6px currentColor,0 0 60px -30px currentColor inset;
  text-shadow:0 0 16px currentColor;animation:rankPop .45s cubic-bezier(.2,1.4,.4,1);
}
@keyframes rankPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1.4rem}
.ms{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.8rem .4rem;border-radius:12px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.05)}
.ms .ms-k{font-size:.58rem;letter-spacing:.18em;color:var(--dim);font-weight:600}
.ms .ms-v{font-size:1.35rem;font-weight:800;color:var(--cyan);text-shadow:0 0 16px rgba(34,224,255,.4);font-variant-numeric:tabular-nums}
.ms:nth-child(1) .ms-v{color:var(--green);text-shadow:0 0 20px rgba(61,255,160,.5);font-size:1.7rem}
.ms:nth-child(2) .ms-v{color:var(--magenta);text-shadow:0 0 20px rgba(255,46,136,.45);font-size:1.7rem}
.chart-box{height:190px;padding:.7rem;border-radius:14px;background:rgba(4,7,11,.55);border:1px solid rgba(255,255,255,.05);margin-bottom:1.5rem}
.modal-actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.btn{
  font-family:inherit;font-size:.76rem;letter-spacing:.14em;font-weight:700;
  padding:.8rem 1.5rem;border-radius:11px;cursor:pointer;transition:all .18s ease;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:#9fb3c8;
  display:inline-flex;align-items:center;gap:.55rem;
}
.btn:hover{color:#fff;border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.btn.primary{color:#04121a;border-color:transparent;background:linear-gradient(140deg,var(--cyan),#7af6ff);box-shadow:0 0 26px -4px rgba(34,224,255,.75)}
.btn.primary:hover{box-shadow:0 0 38px -2px rgba(34,224,255,.95)}
.btn.primary kbd{font-family:inherit;font-size:.6rem;padding:.1rem .35rem;border-radius:4px;background:rgba(0,0,0,.22)}
.ghost-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;border:0;left:50%;top:50%}

/* ================= RESPONSIVE ================= */
@media(max-width:720px){
  :root{--fs:1.28rem;--line-h:2.4rem}
  .app{padding:1.2rem 1rem 1.1rem;border-radius:16px}
  .topbar{justify-content:center}
  .controls{justify-content:center}
  .hud{grid-template-columns:repeat(4,1fr);gap:.45rem}
  .hud-item .v{font-size:1.15rem}
  .hud-item .k{font-size:.52rem;letter-spacing:.14em}
  .modal{padding:1.4rem 1.1rem}
  .modal-stats{grid-template-columns:repeat(2,1fr)}
  .seg-btn{padding:.36rem .52rem;font-size:.68rem}
}
@media(max-width:420px){
  .brand{font-size:.88rem}
  .seg-btn{font-size:.62rem;padding:.32rem .44rem}
  .strict-btn{font-size:.6rem;padding:.44rem .56rem}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(34,224,255,.25);border-radius:8px}
</style>
</head>

  ).trim().split(/\s+/);

  const SENTENCES = [
    'The quick brown fox jumps over the lazy dog while the whole city sleeps.',

    'Courage is not the absence of fear but the triumph over it.',
    'Machines think in numbers while humans dream in colors and stories.',
    'Time is the only currency that cannot be refunded once it is spent.',
    'A clean interface is a silent promise between the designer and the user.',
    'Keep your code close and your documentation closer than that.',
    'Speed is nothing without accuracy so slow down and hit every key.'
  ];

  const CODE_SNIPPETS = [
`function cyberGlow(element) {
  const glow = element.style.boxShadow;
  if (!glow) return null;
  return glow.replace('0', '12px');
}`,
`const neon = document.querySelector('.glow');
neon.addEventListener('click', () => {
  neon.classList.toggle('active');
  console.log('glow toggled');
});`,
`async function fetchData(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Network error');
  return await res.json();
}`,
`const matrix = Array.from({ length: 8 }, (_, i) => i * i);
const total = matrix.reduce((acc, val) => acc + val, 0);
console.log(total);`,
`class Runner {
  constructor(name, speed) {
    this.name = name;
    this.speed = speed;
  }
  boost() {
    return this.speed * 1.5;
  }
}`,
`document.body.style.background = '#0d1117';
document.documentElement.style.setProperty('--accent', '#22e0ff');
window.addEventListener('resize', render);`
  ];

  /* ---------- State ---------- */
  const state = {
    mode:'words', duration:60, words:[], typed:[], current:0,
    started:false, finished:false, elapsed:0, timeLeft:60, startTime:0, lastSecond:0,
    keystrokes:0, errorKeystrokes:0, wpmHistory:[], timerId:null,
    soundOn:true, strict:true
  };

  let wordEls = [];
  let LINE_H = 46;
  let chartInstance = null;
  let audioCtx = null;
  let flashTimer = null;

  const pick = arr => arr[(Math.random()*arr.length)|0];

  function buildWords(mode, count) {
    const out = [];
    if (mode === 'words') {
      while (out.length < count) out.push(pick(WORDS_POOL));
    } else if (mode === 'sentences') {
      while (out.length < count) out.push(...pick(SENTENCES).split(' '));
    } else {
      const tokens = pick(CODE_SNIPPETS).split('\n').map(l=>l.trim()).filter(Boolean).join(' ').split(/\s+/);
      while (out.length < count) out.push(...tokens);
    }
    return out;
  }

  function playClick(isError) {
    if (!state.soundOn) return;
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = isError ? 'sawtooth' : 'square';
      const base = isError ? 165 : 680 + Math.random()*260;
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.exponentialRampToValueAtTime(isError ? 80 : 180, t + 0.045);
      gain.gain.setValueAtTime(isError ? 0.055 : 0.045, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.07);
    } catch(e){}
  }

  function createWordEl(i) {
    const el = document.createElement('div');
    el.className = 'word';
    const w = state.words[i];
    for (const ch of w) {
      const c = document.createElement('span');
      c.className = 'char';
      c.textContent = ch;
      el.appendChild(c);
    }
    wordEls.push(el);
    return el;
  }

  function render() {
    wordsEl.innerHTML = '';
    wordEls = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < state.words.length; i++) frag.appendChild(createWordEl(i));
    wordsEl.appendChild(frag);
    wordsEl.appendChild(caret);
    LINE_H = wordEls[0] ? wordEls[0].offsetHeight : 46;
    wordsEl.style.transform = 'translateY(0)';
    updateWord(0);
    updateCaret();
    updateScroll();
  }

  function updateWord(i) {
    const el = wordEls[i];
    if (!el) return;
    const w = state.words[i];
    const t = state.typed[i] || '';
    const chars = el.children;
    for (let j = 0; j < chars.length; j++) {
      let cls = 'char';
      if (j < t.length) cls += (t[j] === w[j] ? ' correct' : ' incorrect');
      if (chars[j].className !== cls) chars[j].className = cls;
    }
    el.classList.toggle('active', i === state.current);
  }

  function updateCaret() {
    const el = wordEls[state.current];
    if (!el || !el.children.length) return;
    const t = state.typed[state.current] || '';
    const last = el.children.length - 1;
    const idx = Math.min(t.length, last);
    const chEl = el.children[idx];
    let x = chEl.offsetLeft;
    if (t.length >= el.children.length) x = chEl.offsetLeft + chEl.offsetWidth;
    const y = chEl.offsetTop + (LINE_H - caret.offsetHeight) / 2;
    caret.style.transform = `translate(${x}px, ${y}px)`;
  }

  function updateScroll() {
    const el = wordEls[state.current];
    if (!el) return;
    const offset = Math.max(0, el.offsetTop - LINE_H);
    wordsEl.style.transform = `translateY(${-offset}px)`;
  }

  function flashError() {
    const el = wordEls[state.current];
    if (!el) return;
    const t = state.typed[state.current] || '';
    const idx = Math.min(t.length, el.children.length - 1);
    const chEl = el.children[idx];
    if (!chEl) return;
    chEl.classList.remove('blocked');
    void chEl.offsetWidth;
    chEl.classList.add('blocked');
    caret.classList.add('error');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      chEl.classList.remove('blocked');
      caret.classList.remove('error');
    }, 200);
  }

  function computeStats() {
    let correct = 0, typedTotal = 0;
    const upto = Math.min(state.current + 1, state.words.length);
    for (let i = 0; i < upto; i++) {
      const w = state.words[i];
      const t = state.typed[i] || '';
      typedTotal += t.length;
      for (let j = 0; j < t.length; j++) if (t[j] === w[j]) correct++;
      if (i < state.current && t === w) { correct++; typedTotal++; }
    }
    const mins = Math.max(state.elapsed, 1) / 60;
    return {
      correct, typedTotal,
      wpm: (correct / 5) / mins,
      raw: (typedTotal / 5) / mins,
      cpm: correct / mins,
      accuracy: state.keystrokes > 0
        ? ((state.keystrokes - state.errorKeystrokes) / state.keystrokes) * 100
        : 100
    };
  }

  function updateHud() {
    const s = computeStats();
    hudTime.textContent = Math.ceil(state.timeLeft);
    hudTime.classList.toggle('warn', state.timeLeft <= 10 && state.started);
    hudWpm.textContent = Math.round(s.wpm);
    hudAcc.textContent = Math.round(s.accuracy) + '%';
    hudErr.textContent = state.errorKeystrokes;
  }

  function startTest() {
    if (state.started) return;
    state.started = true;
    state.startTime = performance.now();
    state.lastSecond = 0;
    caret.classList.remove('blink');
    /* ads dim during typing */
    adTop && adTop.classList.add('typing-active');
    adBottom && adBottom.classList.add('typing-active');
    state.timerId = setInterval(tick, 100);
  }

  function tick() {
    state.elapsed = (performance.now() - state.startTime) / 1000;
    state.timeLeft = Math.max(0, state.duration - state.elapsed);
    const sec = Math.floor(state.elapsed);
    if (sec > state.lastSecond && sec <= state.duration) {
      state.lastSecond = sec;
      const s = computeStats();
      state.wpmHistory.push({ t: sec, wpm: Math.max(0, Math.round(s.wpm)) });
    }
    updateHud();
    if (state.elapsed >= state.duration) finishTest();
  }

  function finishTest() {
    if (state.finished) return;
    state.finished = true;
    clearInterval(state.timerId);
    state.elapsed = state.duration;
    state.timeLeft = 0;
    caret.classList.add('blink');
    caret.classList.remove('error');
    adTop && adTop.classList.remove('typing-active');
    adBottom && adBottom.classList.remove('typing-active');
    const s = computeStats();
    if (state.wpmHistory.length === 0 ||
        state.wpmHistory[state.wpmHistory.length-1].t < state.duration) {
      state.wpmHistory.push({ t: state.duration, wpm: Math.max(0, Math.round(s.wpm)) });
    }
    updateHud();
    showModal(s);
  }

  function getRank(wpm) {
    if (wpm >= 110) return { name:'GOD-SPEED',     color:'#ff2e88' };
    if (wpm >= 90)  return { name:'NETRUNNER',     color:'#b06bff' };
    if (wpm >= 70)  return { name:'SPEED DEMON',   color:'#ff6b3d' };
    if (wpm >= 50)  return { name:'CYBER-CODER',   color:'#22e0ff' };
    if (wpm >= 30)  return { name:'SCRIPT KIDDIE', color:'#4a9eff' };
    return                 { name:'NOVICE',        color:'#7d8b9b' };
  }

  function showModal(s) {
    overlay.classList.add('show');
    const rank = getRank(s.wpm);
    rankBadge.textContent = rank.name;
    rankBadge.style.setProperty('--rank', rank.color);
    rWpm.textContent   = Math.round(s.wpm);
    rAcc.textContent   = Math.round(s.accuracy) + '%';
    rRaw.textContent   = Math.round(s.raw);
    rCpm.textContent   = Math.round(s.cpm);
    rErr.textContent   = state.errorKeystrokes;
    rChars.textContent = s.correct + '/' + s.typedTotal;
    drawChart();
  }

  function hideModal() { overlay.classList.remove('show'); }

  function drawChart() {
    const canvas = document.getElementById('chart');
    if (!canvas) return;
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    if (typeof Chart === 'undefined') return;
    const labels = state.wpmHistory.map(p => p.t + 's');
    const data   = state.wpmHistory.map(p => p.wpm);
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 190);
    grad.addColorStop(0, 'rgba(34,224,255,0.35)');
    grad.addColorStop(1, 'rgba(34,224,255,0.00)');
    chartInstance = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[{ label:'WPM', data,
        borderColor:'#22e0ff', backgroundColor:grad, borderWidth:2, fill:true,
        tension:0.38, pointRadius:0, pointHoverRadius:4, pointHoverBackgroundColor:'#ff2e88' }] },
      options:{
        responsive:true, maintainAspectRatio:false,
        animation:{ duration:700, easing:'easeOutQuart' },
        interaction:{ intersect:false, mode:'index' },
        plugins:{
          legend:{ display:false },
          tooltip:{ backgroundColor:'rgba(8,12,18,.95)', borderColor:'rgba(34,224,255,.4)',
            borderWidth:1, titleColor:'#22e0ff', bodyColor:'#c9d1d9',
            titleFont:{ family:'JetBrains Mono', size:11 },
            bodyFont:{ family:'JetBrains Mono', size:12 }, displayColors:false }
        },
        scales:{
          x:{ grid:{ color:'rgba(255,255,255,.045)' },
              ticks:{ color:'#4c5866', font:{ family:'JetBrains Mono', size:10 }, maxTicksLimit:8, maxRotation:0 } },
          y:{ beginAtZero:true, grid:{ color:'rgba(255,255,255,.045)' },
              ticks:{ color:'#4c5866', font:{ family:'JetBrains Mono', size:10 }, precision:0 } }
        }
      }
    });
  }

  function handleChar(ch) {
    if (!state.started) startTest();
    if (state.finished) return;
    const w = state.words[state.current];
    if (!w) return;
    const t = state.typed[state.current] || '';
    if (t.length >= w.length) return;
    const expected = w[t.length];
    const ok = (ch === expected);
    state.keystrokes++;
    if (!ok) {
      state.errorKeystrokes++;
      playClick(true);
      if (state.strict) { flashError(); updateHud(); return; }
    } else { playClick(false); }
    state.typed[state.current] = t + ch;
    updateWord(state.current);
    updateCaret();
    updateHud();
  }

  function handleSpace() {
    if (!state.started || state.finished) return;
    const w = state.words[state.current];
    if (!w) return;
    const t = state.typed[state.current] || '';
    if (!t.length) return;
    if (state.strict && t !== w) {
      state.keystrokes++; state.errorKeystrokes++;
      playClick(true); flashError(); updateHud();
      return;
    }
    wordEls[state.current].classList.remove('active');
    state.current++;
    if (state.current >= state.words.length - 20) extendWords(120);
    wordEls[state.current].classList.add('active');
    playClick(false);
    updateCaret(); updateScroll(); updateHud();
  }

  function handleBackspace() {
    if (!state.started || state.finished) return;
    const t = state.typed[state.current] || '';
    if (t.length > 0) {
      state.typed[state.current] = t.slice(0, -1);
      updateWord(state.current);
    } else if (state.current > 0) {
      wordEls[state.current].classList.remove('active');
      state.current--;
      wordEls[state.current].classList.add('active');
      updateWord(state.current);
    }
    playClick(false);
    updateCaret(); updateScroll(); updateHud();
  }

  function extendWords(n) {
    const extra = buildWords(state.mode, n);
    const frag = document.createDocumentFragment();
    for (const w of extra) {
      state.words.push(w);
      state.typed.push('');
      frag.appendChild(createWordEl(state.words.length - 1));
    }
    wordsEl.insertBefore(frag, caret);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); resetTest(); return; }
    if (state.finished) {
      if (e.key === 'Enter') { e.preventDefault(); resetTest(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Tab') { e.preventDefault(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); handleBackspace(); return; }
    if (e.key === ' ') { e.preventDefault(); handleSpace(); return; }
    if (e.key === 'Enter') { e.preventDefault(); return; }
    if (e.key.length === 1) { e.preventDefault(); handleChar(e.key); }
  });

  document.addEventListener('click', () => {
    if (document.activeElement !== ghostInput) ghostInput.focus({ preventScroll: true });
  });
  ghostInput.addEventListener('input', () => { ghostInput.value = ''; });

  function resetTest() {
    clearInterval(state.timerId);
    clearTimeout(flashTimer);
    state.started = false; state.finished = false; state.elapsed = 0;
    state.timeLeft = state.duration; state.startTime = 0; state.lastSecond = 0;
    state.keystrokes = 0; state.errorKeystrokes = 0; state.wpmHistory = []; state.current = 0;
    const count = Math.max(140, state.duration * 3);
    state.words = buildWords(state.mode, count);
    state.typed = new Array(state.words.length).fill('');
    hideModal();
    render();
    updateHud();
    caret.classList.add('blink');
    caret.classList.remove('error');
    caret.style.transform = 'translate(0,0)';
    adTop && adTop.classList.remove('typing-active');
    adBottom && adBottom.classList.remove('typing-active');
    requestAnimationFrame(() => { updateCaret(); updateScroll(); });
    if (ghostInput) ghostInput.focus({ preventScroll: true });
  }

  document.getElementById('timeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn'); if (!btn) return;
    document.querySelectorAll('#timeSeg .seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.duration = parseInt(btn.dataset.time, 10);
    resetTest();
  });

  document.getElementById('modeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn'); if (!btn) return;
    document.querySelectorAll('#modeSeg .seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    resetTest();
  });

  strictBtn.addEventListener('click', () => {
    state.strict = !state.strict;
    strictBtn.classList.toggle('on', state.strict);
    strictBtn.textContent = state.strict ? 'STRICT' : 'FREE';
    const tag = document.querySelector('.hint .on-tag');
    if (tag) {
      tag.textContent = state.strict ? 'STRICT ON' : 'FREE MODE';
      tag.style.color = state.strict ? 'var(--magenta)' : 'var(--cyan)';
    }
  });

  soundBtn.addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    soundBtn.classList.toggle('on', state.soundOn);
    soundBtn.textContent = state.soundOn ? '🔊' : '🔇';
    if (state.soundOn) playClick(false);
  });

  restartBtn.addEventListener('click', resetTest);
  againBtn.addEventListener('click', resetTest);
  closeBtn.addEventListener('click', () => { hideModal(); resetTest(); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) { hideModal(); resetTest(); } });
  typingArea.addEventListener('click', () => ghostInput.focus({ preventScroll: true }));

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (wordEls[0]) LINE_H = wordEls[0].offsetHeight;
      updateCaret(); updateScroll();
    }, 120);
  });

  document.getElementById('yr').textContent = new Date().getFullYear();
  resetTest();
})();
</script>
</body>
</html>
